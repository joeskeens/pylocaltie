[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pylocaltie"
version = "0.1.0"
description = "GNSS/VLBI local-tie estimation, VDIF-to-RINEX conversion, and ionospheric analysis tools"
requires-python = ">=3.10"

# This repo is a flat collection of standalone, directly-run scripts
# (tie_estimation/, iono_tools/, misc/, vdif2rinex/), not a Python
# package hierarchy. The one thing they all share is single_diff_tools.py
# at the repo root. Installing it in editable mode (`pip install -e .`)
# puts the repo root permanently on sys.path, so
# `from single_diff_tools import ...` resolves from any script, in any
# subdirectory, regardless of current working directory.
[tool.setuptools]
py-modules = ["single_diff_tools"]
packages = []
